name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'patch | minor | major'
        required: true
        default: patch

permissions: {}

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bump version
        run: npm version ${{ github.event.inputs.release_type }} --no-git-tag-version

      - name: Sync plugin versions
        run: node ./scripts/sync-version.mjs

      - name: Quality gates
        run: |
          npm ci
          npm test
          npm run validate

      - name: Verify push token identity
        env:
          PUSH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          LOGIN=$(curl -sS -H "Authorization: Bearer ${PUSH_TOKEN}" https://api.github.com/user | jq -r '.login // "INVALID"')
          echo "push token belongs to: ${LOGIN}"
          echo "secret present: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }}"

      - name: Commit and tag
        id: release
        env:
          PUSH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION=$(node -p "require('./package.json').version")
          LOGIN=$(curl -sS -H "Authorization: Bearer ${PUSH_TOKEN}" https://api.github.com/user | jq -r '.login // "x-access-token"')
          echo "pushing as: ${LOGIN}"
          git add -A
          git commit -m "chore(release): v${VERSION}"
          git tag "v${VERSION}"
          git remote set-url origin "https://${LOGIN}:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin main
          git push origin "v${VERSION}"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          generate_release_notes: true
