name: CD Production

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  npm-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npm run validate
      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  remote-deploy:
    needs: npm-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for cloud-server
        id: check
        run: echo "exists=$(test -d cloud-server && echo true || echo false)" >> $GITHUB_OUTPUT
      - name: Deploy production environment
        if: steps.check.outputs.exists == 'true'
        run: |
          echo "TODO: cloud-server production deploy (build image -> push SWR -> canary 10% -> monitor -> full rollout)."

  sync-to-org:
    needs: npm-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Sync main and tags to huaweicloud org + GitCode
        env:
          HUAWEICLOUD_ORG_TOKEN: ${{ secrets.HUAWEICLOUD_ORG_TOKEN }}
          GITCODE_USERNAME: ${{ secrets.GITCODE_USERNAME }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          set -e
          git fetch origin main:refs/remotes/origin/main
          failed=0
          targets=(
            "https://x-access-token:${HUAWEICLOUD_ORG_TOKEN}@github.com/huaweicloud/HuaweiCloud-Devkit.git"
            "https://${GITCODE_USERNAME}:${GITCODE_TOKEN}@gitcode.com/huaweicloud/huaweicloud-devkit.git"
          )
          for url in "${targets[@]}"; do
            name="${url%%@*}"
            attempt=0
            synced=0
            while [ "$attempt" -lt 3 ]; do
              attempt=$((attempt+1))
              echo "Sync attempt ${attempt}/3 -> ${name}"
              if git push "${url}" refs/remotes/origin/main:main && git push "${url}" --tags; then
                echo "OK: synced to ${name}"
                synced=1
                break
              fi
              sleep 5
            done
            if [ "$synced" -ne 1 ]; then
              echo "::error::Sync failed to ${name} after 3 attempts"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more mirrors failed. Re-run 'Sync to Org Mirrors' workflow."
            exit 1
          fi
          echo "Synced main + tags to huaweicloud/HuaweiCloud-Devkit and GitCode"
